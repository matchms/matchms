name: CI Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first_check:
    name: First check / Python 3.13 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check --output-format=github
      - name: Test with coverage
        run: uv run --frozen pytest --cov --cov-report=term --cov-report=xml --junitxml=xunit-result.xml
      - name: Normalize coverage paths
        run: sed -i "s+$PWD/++g" coverage.xml
      - name: Store PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n --arg pr_number "$PR_NUMBER" --arg head_ref "$HEAD_REF" --arg base_ref "$BASE_REF" \
            '{"pr_number": $pr_number, "head_ref": $head_ref, "base_ref": $base_ref}' > pr_metadata.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: sonarcloud-data-pip
          path: |
            coverage.xml
            xunit-result.xml
            pr_metadata.json
          if-no-files-found: warn

  test_dev:
    name: Tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: first_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install core and dev dependencies (no chemap extra)
        run: uv sync --frozen
      - name: Check interpreter
        run: uv run --frozen python --version
      - name: Run tests
        run: uv run --frozen pytest

  build_pypi:
    name: Build and validate distributions
    needs: first_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

  test_docs:
    name: Build and test documentation
    needs: first_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install docs dependencies
        run: uv sync --frozen --group docs
      - name: Build docs and run doctests
        working-directory: readthedocs/
        env:
          SPHINXOPTS: '-n'
        run: uv run --frozen --group docs make coverage doctest html
      - name: Check documentation coverage threshold
        shell: bash
        run: |
          cat readthedocs/_build/coverage/python.txt
          uncovered=$(grep -c '\*' readthedocs/_build/coverage/python.txt || true)
          if (( uncovered > 10 )); then
            echo "Too many undocumented members: $uncovered (maximum 10)"
            exit 1
          fi

  installation_checks:
    name: Optional dependency installations
    needs: first_check
    uses: ./.github/workflows/CI_installation_checks.yml
