name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

    inputs:
      tag:
        description: Tag for manually running the publish workflow
        required: False
        default: ''

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Verify distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
