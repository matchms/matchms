name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

    inputs:
      tag:
        description: Tag for manually running the publish workflow
        required: False
        default: ''

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Verify distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
