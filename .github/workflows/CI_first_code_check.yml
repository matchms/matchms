name: CI first code check

on:
  push:
  workflow_call:
  workflow_dispatch:

jobs:
  first_check:
    name: first code check / python-3.12 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Install package with dev dependencies
        run: uv sync --locked
      - name: Run ruff linter
        run: uv run ruff check --output-format=github
      - name: Test with coverage
        run: uv run pytest --cov --cov-report term --cov-report xml --junitxml=xunit-result.xml
      - name: Correct coverage paths
        run: sed -i "s+$PWD/++g" coverage.xml
      # SonarCloud.yml consumes these files for pull requests (via CI_build.yml).
      - name: Store PR metadata in json file
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n --arg pr_number "$PR_NUMBER"\
                --arg head_ref "$HEAD_REF"\
                --arg base_ref "$BASE_REF"\
            '{"pr_number": $pr_number, "head_ref": $head_ref, "base_ref": $base_ref}' > pr_metadata.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: sonarcloud-data
          path: |
            coverage.xml
            xunit-result.xml
            pr_metadata.json
