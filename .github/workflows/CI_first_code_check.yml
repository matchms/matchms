name: CI first code check

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first_check:
    name: First check / Python 3.13 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check --output-format=github
      - name: Test
        run: uv run --frozen pytest
