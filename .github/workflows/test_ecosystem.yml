name: Test Ecosystem

# Compatibility monitoring is informative, not a required PR check.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_dependencies:
    name: ${{ matrix.package }} / NumPy ${{ matrix.numpy-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [spec2vec, ms2deepscore, ms2query]
        numpy-version: ['2.0', '2.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Create isolated environment
        run: uv venv --python 3.12
      - name: Install NumPy, downstream package and local matchms
        id: install
        continue-on-error: true
        run: uv pip install --python .venv "numpy==${{ matrix.numpy-version }}.*" '${{ matrix.package }}' .
      - name: Check installed dependencies
        id: dependency_check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: uv pip check --python .venv
      - name: Write compatibility result
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          NUMPY: ${{ matrix.numpy-version }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CHECK_RESULT: ${{ steps.dependency_check.outcome }}
        run: |
          mkdir -p test-output
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              'package': os.environ['PACKAGE'],
              'numpy-version': os.environ['NUMPY'],
              'install': os.environ['INSTALL_RESULT'],
              'dependency_check': os.environ['CHECK_RESULT'],
              'run_success': os.environ['INSTALL_RESULT'] == 'success' and os.environ['CHECK_RESULT'] == 'success',
          }
          Path(f"test-output/{payload['numpy-version']}-{payload['package']}.json").write_text(json.dumps(payload))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-${{ matrix.numpy-version }}-${{ matrix.package }}
          path: test-output/

  combine_results:
    name: Combine ecosystem results
    needs: test_dependencies
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ecosystem-*
          merge-multiple: true
          path: test-output/
      - name: Generate Markdown summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          packages = ['spec2vec', 'ms2deepscore', 'ms2query']
          lines = ['| NumPy | ' + ' | '.join(packages) + ' |', '|---|---|---|---|']
          for numpy in ('2.0', '2.3'):
              cells = []
              for package in packages:
                  path = Path(f'test-output/{numpy}-{package}.json')
                  if not path.exists():
                      cells.append('No result')
                  else:
                      result = json.loads(path.read_text())
                      cells.append('Pass' if result['run_success'] else 'Fail')
              lines.append('| ' + numpy + ' | ' + ' | '.join(cells) + ' |')
          summary = '\n'.join(lines) + '\n'
          Path('test-output/dependency-matrix.md').write_text(summary)
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as output:
              output.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-test-matrix
          path: test-output/
