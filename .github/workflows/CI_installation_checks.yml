name: CI installation checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation_check:
    name: Install ${{ matrix.variant }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: core, python-version: '3.13', install_target: '.', expect_chemap: 'false', expect_networkx: 'false'}
          - {variant: core, python-version: '3.14', install_target: '.', expect_chemap: 'false', expect_networkx: 'false'}
          - {variant: networking, python-version: '3.14', install_target: '.[networking]', expect_chemap: 'false', expect_networkx: 'true'}
          - {variant: fingerprints, python-version: '3.13', install_target: '.[fingerprints]', expect_chemap: 'true', expect_networkx: 'false'}
          - {variant: all, python-version: '3.13', install_target: '.[all]', expect_chemap: 'true', expect_networkx: 'true'}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create isolated environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install selected extra
        run: uv pip install --python .venv '${{ matrix.install_target }}'
      - name: Check dependency consistency
        run: uv pip check --python .venv
      - name: Verify imports
        shell: bash
        env:
          EXPECT_CHEMAP: ${{ matrix.expect_chemap }}
          EXPECT_NETWORKX: ${{ matrix.expect_networkx }}
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import os
          import matchms

          for name, env_var in (("chemap", "EXPECT_CHEMAP"), ("networkx", "EXPECT_NETWORKX")):
              expected = os.environ[env_var] == "true"
              actual = importlib.util.find_spec(name) is not None
              assert actual == expected, f"{name}: expected {expected}, got {actual}"

          if os.environ["EXPECT_NETWORKX"] == "true":
              from matchms.networking import SimilarityNetwork
              SimilarityNetwork()
          if os.environ["EXPECT_CHEMAP"] == "true":
              import chemap
              from matchms import Fingerprints
          print("Successful matchms import:", matchms.__file__)
          PY
