name: CI installation checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation_check:
    name: Install ${{ matrix.variant }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: core, python-version: '3.13', install_target: '.', expect_chemap: 'false'}
          - {variant: core, python-version: '3.14', install_target: '.', expect_chemap: 'false'}
          - {variant: fingerprints, python-version: '3.13', install_target: '.[fingerprints]', expect_chemap: 'true'}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create isolated environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install package
        run: uv pip install --python .venv '${{ matrix.install_target }}'
      - name: Check dependency consistency
        run: uv pip check --python .venv
      - name: Verify imports
        shell: bash
        env:
          EXPECT_CHEMAP: ${{ matrix.expect_chemap }}
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import os
          import matchms

          expect_chemap = os.environ["EXPECT_CHEMAP"] == "true"
          has_chemap = importlib.util.find_spec("chemap") is not None
          assert has_chemap == expect_chemap, (
              f"chemap availability: expected {expect_chemap}, got {has_chemap}"
          )
          if expect_chemap:
              import chemap
              from matchms import Fingerprints

          print("Successful matchms import:", matchms.__file__)
          PY
