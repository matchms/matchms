name: CI Generate Dev Requirements

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Export development dependencies
        run: uv export --frozen --group dev --no-hashes --no-emit-project -o dev-requirements.txt
      - name: Commit changed requirements (if any)
        shell: bash
        run: |
          git add dev-requirements.txt
          if git diff --cached --quiet; then
            echo 'No changes to dev-requirements.txt'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update dev-requirements.txt'
          git push
