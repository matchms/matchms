name: CI Generate Dev Requirements

on:
  push:
    branches:
      - master
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for manually running CI generate dev requirements workflow
        required: False
        default: ''

jobs:
  generate-requirements:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-suffix: generate-reqs

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Export dev dependencies to dev-requirements.txt
        run: uv export --group dev --no-hashes -o dev-requirements.txt

      - name: Commit and push dev-requirements.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev-requirements.txt
          git commit -m "Update dev-requirements.txt"
          git push
